services:
  db:
    image: postgres:16
    container_name: odoo19_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - odoo19_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  odoo:
    image: alakosha/odoo-image:19.0
    container_name: odoo19_web
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/opt/odoo/source:ro
      - ./project-addons:/opt/odoo/custom-addons
      - ./conf/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./logs:/var/log/odoo
      - odoo19_data:/var/lib/odoo
    ports:
      - "8069:8069"
      - "8072:8072"
      # Uncomment to enable remote debugger (set ENABLE_DEBUGGER=1 in .env):
      # - "5678:5678"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      DEV_MODE: ${DEV_MODE:-0}
      ENABLE_DEBUGGER: ${ENABLE_DEBUGGER:-0}
      # WAIT_FOR_DB: ${WAIT_FOR_DB:-0}
      # LOG_LEVEL: ${LOG_LEVEL:-}
      # ODOO_EXTRA_ARGS: ${ODOO_EXTRA_ARGS:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8069/web/health || curl -sf http://localhost:8069/web/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  odoo19_db_data:
  odoo19_data:
